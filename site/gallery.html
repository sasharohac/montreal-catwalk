<!DOCTYPE html>
<html lang="en">

<!-- ============================================================
     gallery.html = STRUCTURE of the gallery page: every cat photo, grouped by month, newest first.
     Its look is in style.css + gallery.css; gallery.js fills in the photos.
     ============================================================ -->

<!-- HEAD: setup the visitor doesn't see -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatMap Gallery</title>

  <!-- Shared colours and fonts from the map page, then the gallery's own layout -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gallery.css">
</head>

<!-- BODY: what appears on screen -->
<body class="gallery-page">
  <!-- Site navigation: the same bar is on every page (index, gallery, about) -->
  <header class="site-header">
    <a class="site-name" href="index.html">The Montréal CatWalk</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="index.html">Map</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="about.html">About this map</a>
    </nav>
  </header>

  <!-- Page title and a status line that gallery.js updates -->
  <header class="gallery-header">
    <h1>CatMap Gallery</h1>
    <p id="status">Loading cats…</p>
  </header>

  <!-- Empty box that gallery.js fills with one section per month -->
  <main id="gallery"></main>

  <!-- Cat paw peeking up from the bottom-right corner; it follows you down the page (see gallery.css) -->
  <img class="paw" src="icons/18ba5d426eae90d75234a5df205081a8.gif" alt="">

  <!-- Big view of one photo ("lightbox"). Hidden until gallery.js opens it.
       <dialog> is built into browsers: it dims the page behind it and closes with Esc. -->
  <dialog id="lightbox" class="lightbox">
    <button class="lb-button lb-close" type="button" aria-label="Close">✕</button>
    <button class="lb-button lb-prev" type="button" aria-label="Previous photo">←</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption>
        <span id="lb-caption"></span>
        <a id="lb-map" class="map-link" href="index.html">Show on map →</a>
      </figcaption>
    </figure>
    <button class="lb-button lb-next" type="button" aria-label="Next photo">→</button>
  </dialog>

  <!-- Script last, so everything above already exists when it runs -->
  <script src="gallery.js"></script>
</body>
</html>
